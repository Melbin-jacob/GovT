[project]
name = "govhub-shared"
version = "0.1.0"
description = "Shared models and OSCAL helpers for the Canadian AI Governance Hub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "compliance-trestle==3.12.4",
    "jsonschema[format-nongpl]>=4.23",
    "pydantic>=2.9,<3",
    "regex>=2024.11",
    "httpx>=0.28",
    "pyjwt>=2.10,<3",
    "fastapi>=0.115",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govhub_shared"]
