name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: govhub
          POSTGRES_PASSWORD: govhub
          POSTGRES_DB: rulebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govhub -d rulebook_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RULEBOOK_TEST_DATABASE_URL: postgresql+psycopg://govhub:govhub@localhost:5432/rulebook_test
      REVIEW_DESK_TEST_DATABASE_URL: postgresql+psycopg://govhub:govhub@localhost:5432/review_desk_test
      ASSESSMENT_TEST_DATABASE_URL: postgresql+psycopg://govhub:govhub@localhost:5432/assessment_engine_test
      CONTROL_CENTRE_TEST_DATABASE_URL: postgresql+psycopg://govhub:govhub@localhost:5432/control_centre_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Committed catalogs match the golden-set CSVs
        run: |
          uv run rulebook import-golden data/golden/dadm-section6.csv --check
          uv run rulebook import-golden data/demo/golden/example-widgets.csv \
            --out-dir data/demo/catalogs --check
      - name: Accuracy harness on synthetic cases (recorded replies, no model) and release gate
        run: |
          set -euo pipefail
          uv run python scripts/make_synthetic_recordings.py --check
          make accuracy
          cat accuracy-output/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the accuracy run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-output
          path: accuracy-output/
          if-no-files-found: ignore
      - name: French UI strings list is current; EN/FR keys match
        run: |
          uv run control-centre check-strings
          python3 scripts/fr_strings.py --check
      - name: Committed source metadata matches the synthetic source files
        run: uv run rulebook import-source --check data/demo/sources/*.txt data/demo/sources/*.html

  golden-set-hygiene:
    name: Golden set changes advance SOURCE_DATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: make setup
      - name: Check every new commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # New branch (all-zero SHA) or rewritten history: check the whole history.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          uv run rulebook check-source-date ${base:+--base "$base"} --head "$GITHUB_SHA"

  container:
    name: Build image and serve via Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: make up
      - name: Liveness
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Readiness (database reachable)
        run: curl --fail --silent --show-error http://localhost:8000/ready
      - name: Connector hub, mock ServiceNow and review desk are up (localhost only)
        run: |
          curl --fail -sS http://127.0.0.1:8001/health
          curl --fail -sS http://127.0.0.1:8002/ready
          curl --fail -sS http://127.0.0.1:8003/__mock/health
          curl --fail -sS http://127.0.0.1:8005/ready
      - name: Control centre UI is up (localhost only, both languages)
        run: |
          curl --fail -sS http://127.0.0.1:8004/health
          curl --fail -sS http://127.0.0.1:8004/ | grep -q 'href="/fr/"'
          curl --fail -sS http://127.0.0.1:8004/fr/sign-in | grep -q 'lang="fr"'
      - name: Vendored OSCAL schemas resolve inside the image
        run: >-
          docker compose exec -T rulebook python -c
          "from govhub_shared.oscal import schema_dir; print(schema_dir())"
      - name: API smoke test (store golden catalogs, retire, diff)
        run: |
          set -euo pipefail
          # Development keys only: a governance officer's internal token for the rulebook.
          token=$(docker compose exec -T control-centre python -m govhub_shared.auth.mint \
            --keys /keys --aud rulebook --user demo-officer-01)
          auth="Authorization: Bearer $token"
          version=$(python3 -c 'import json; print(json.load(open("data/catalogs/dadm-section6.en.json"))["catalog"]["metadata"]["version"])')
          next=$(python3 -c "v='$version'.split('.'); print(f'{v[0]}.{int(v[1]) + 1}.0')")
          for lang in en fr; do
            curl --fail -sS -X POST localhost:8000/catalogs -H "$auth" -H 'content-type: application/json' \
              --data-binary @data/catalogs/dadm-section6.$lang.json
            echo
          done
          curl --fail -sS -X POST -H "$auth" \
            "localhost:8000/catalogs/dadm-section6/versions/$version/retire-control/DADM-6.3.5"
          echo
          curl --fail -sS -H "$auth" "localhost:8000/catalogs/dadm-section6/diff?from=$version&to=$next" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["summary"]); assert d["retired"] == ["DADM-6.3.5"]'
      - name: Example profile resolves inside the image
        run: >-
          docker compose exec -T rulebook
          rulebook resolve-profile data/profiles/dadm-level-ii-plus.json --ids
      - name: Demo - policy diff to impact report (synthetic data)
        run: scripts/demo-impact.sh http://localhost:8000 demo-output
      - name: Demo - task to human decision (mock ServiceNow, synthetic data)
        run: scripts/demo-review.sh demo-review-output
      - name: Demo - assessment engine drafts (scripted fake model over HTTP, synthetic data)
        run: scripts/demo-assessment.sh demo-assessment-output
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Install the end-to-end test tools and Chromium
        run: |
          make setup
          uv run playwright install --with-deps chromium
      - name: Demo - UI click-through in English and French (Playwright, axe)
        run: make demo-ui
      - name: Demo - policy change to AI drafts, approval in the UI, catalog 1.1.0, impact (synthetic)
        run: make demo-drafts
      - name: Drafts demo summary
        if: always()
        run: tee -a "$GITHUB_STEP_SUMMARY" < e2e-output/drafts/summary.md || true
      - name: UI test summary (axe results and timings)
        if: always()
        run: tee -a "$GITHUB_STEP_SUMMARY" < e2e-output/summary.md || true
      - name: Keep UI screenshots, axe results and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-output
          path: e2e-output/
          if-no-files-found: ignore
      - name: Keep demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            demo-output/
            demo-review-output/
            demo-assessment-output/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
