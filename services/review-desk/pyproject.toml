[project]
name = "govhub-review-desk"
version = "0.1.0"
description = "Review desk: ranked review queue, hash-chained decision log, POA&M, forecast"
requires-python = ">=3.12,<3.13"
dependencies = [
    "govhub-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.scripts]
review-desk = "review_desk.cli:main"

[tool.uv.sources]
govhub-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_desk"]
