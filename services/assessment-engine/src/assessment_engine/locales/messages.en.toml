# English text the assessment engine generates (rationales). Same keys as messages.fr.toml.
[messages]
"rule.met" = "Rule-based check (unverified draft rule): {rule} Facts used: {facts}."
"rule.missing" = "Rule-based check (unverified draft rule): {rule} Missing facts: {missing}."
"rule.not-applicable" = "Rule-based check (unverified draft rule): {rule} It does not apply here. Facts used: {facts}."
"rule.rollup" = "Rule-based roll-up (unverified draft rule): {rule}"
"rule.no-rule" = "No rule is written for this rule-based check yet."
"fact" = "{label} = {value} (source: {source})"
"fact.no-source" = "{label} = {value}"
"value.true" = "yes"
"value.false" = "no"
"list.and" = "and"
"judgment.drafted" = "Drafted by the model {model} (prompt {prompt}); a person decides. {reasoning}"
"judgment.downgraded" = "The model's draft verdict ({model_verdict}) was set to unable to determine: {reason}"
"reason.no-evidence" = "no evidence passage matches this requirement yet."
"reason.model-unavailable" = "the model server could not be reached."
"reason.unparseable" = "the model's reply could not be read."
"reason.invalid-verdict" = "the model gave a verdict outside the five allowed."
"reason.no-citation" = "the model did not cite an evidence passage."
"reason.unknown-passage" = "the model cited a passage that was not provided."
"reason.quote-not-found" = "the quoted sentence is not in the cited passage."
"reason.flagged-support" = "the only passage supporting \"met\" contains instruction-like text (possible prompt injection)."
"reason.low-confidence" = "the confidence {confidence} is below the threshold {threshold}."
