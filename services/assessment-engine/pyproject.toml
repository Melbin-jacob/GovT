[project]
name = "govhub-assessment-engine"
version = "0.1.0"
description = "Assessment engine: rule-based checks in code, judgment checks drafted by a self-hosted model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "govhub-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "cryptography>=44",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.scripts]
assessment-engine = "assessment_engine.cli:main"

[tool.uv.sources]
govhub-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assessment_engine"]
