# English templates for the text the rulebook generates (impact-report reasons, maintenance
# items, excluded systems, ServiceNow task text). Same keys as explanations.fr.toml (test).
# Placeholders in {braces} are filled by rulebook/explain.py. Reports carry a code, its
# parameters and the text in both languages, so the report itself is language-neutral.

[templates]
"reason.clause-changed" = "Clause {old} changed (similarity {score})"
"reason.clause-changed-renumbered" = "Clause {old} changed and became {new} (similarity {score})"
"reason.clause-split" = "Clause {old} split into {into}"
"reason.clause-merged" = "Clauses {olds} merged into {into}"
"reason.clause-removed" = "Clause {clause} removed in version {version}"
"reason.clause-added" = "Clause {clause} added in version {version}"
"reason.control-changed" = "Control changed between versions {from} and {to}: {fields}"
"reason.control-added" = "Control new in version {version}"
"maintenance.unmapped-changed" = "Clause {old} changed and became {new} (similarity {score}), but no control is linked to it"
"maintenance.update-reference" = "Wording unchanged, renumbered {old} to {new}: update the clause reference"
"maintenance.unmapped-split" = "Clause {old} split into {into}, but no control is linked to it"
"maintenance.unmapped-merge" = "Clauses {olds} merged into {into}, but no control is linked to them"
"maintenance.removed-no-control" = "Clause {clause} removed in version {version}; no control was linked to it"
"maintenance.unmapped-added" = "Clause {clause} added in version {version}; no control yet (draft one)"
"maintenance.language-divergence" = "English and French versions differ ({kind}): English {en}, French {fr}"
"maintenance.control-retired" = "Control retired: close the open findings for it"
"divergence.mapping" = "clause mapping"
"divergence.obligation" = "obligation"
"divergence.text-change" = "change of wording"
"excluded.lifecycle-retired" = "System retired"
"excluded.no-profile" = "No profile of this system selects controls from {catalog}"
"excluded.no-affected-control" = "No affected control is in this system's scope"
"task.title" = "Reassess {n} control(s) for {system}"
"task.intro" = "Rule change: {trigger}. Reassess the controls below and attach evidence."
"task.obligation" = "[OBLIGATION CHANGE]"
"due.basis" = "{status}: impact level {level} = {days} days ({scope})"
"due.scope.default" = "default"
"due.scope.tenant" = "override for {tenant}"
"due.unknown-level" = "Impact level unknown, treated as IV"
"field.part:statement" = "statement"
"field.part:guidance" = "guidance"
"field.part:assessment-objective" = "assessment objective"
"field.title" = "title"
"field.prop:label" = "label"
"field.prop:hub:obligation" = "obligation"
"field.prop:hub:check-type" = "check type"
"field.class" = "class"
"list.and" = "and"
