<form method="post" action="/{{ lang }}/drafts/actor" class="inline-form acting-as">
  <input type="hidden" name="back" value="{{ back_url if back_url is defined else '/' ~ lang ~ '/drafts' }}">
  <div class="field">
    <label for="actor">{{ t('drafts.acting_as') }}</label>
    <span id="actor-hint" class="hint">{{ t('drafts.acting_as_hint') }}</span>
    <select id="actor" name="actor" aria-describedby="actor-hint">
      {% for a, role in actors.items() %}<option value="{{ a }}"{% if a == actor %} selected{% endif %}>{{ a }} ({{ t('role.' ~ role) }})</option>{% endfor %}
    </select>
  </div>
  <div class="field"><button type="submit" class="secondary">{{ t('drafts.acting_as_button') }}</button></div>
</form>
