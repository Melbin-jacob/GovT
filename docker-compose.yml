# Local development only. Production runs the same images on Kubernetes/OpenShift.
#
# Ports: the rulebook API is published on localhost:8000. connector-hub, review-desk and
# the mock ServiceNow and control-centre are published on 127.0.0.1 ONLY: review-desk and
# the demo UI trust placeholder identity until sign-in exists; never reachable from outside.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: govhub
      POSTGRES_PASSWORD: govhub  # local dev only
      POSTGRES_DB: rulebook
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govhub -d rulebook"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rulebook:
    build:
      context: .
      dockerfile: services/rulebook/Dockerfile
    environment:
      RULEBOOK_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/rulebook
      # Approval-log checkpoints on their own volume, not the database's.
      RULEBOOK_APPROVAL_CHECKPOINT_FILE: /checkpoints/approval-log.jsonl
    volumes:
      - rulebook-checkpoints:/checkpoints
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mock ServiceNow (Table API subset) seeded with the fictional demo records. CI and the
  # demo use this; a real instance is configured with SERVICENOW_* variables instead.
  mock-servicenow:
    build:
      context: .
      dockerfile: services/connector-hub/Dockerfile
    command: ["connector-hub", "mock-servicenow", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/__mock/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  connector-hub:
    build:
      context: .
      dockerfile: services/connector-hub/Dockerfile
    environment:
      SERVICENOW_INSTANCE_URL: http://mock-servicenow:8000
      SERVICENOW_USERNAME: govhub.integration
      SERVICENOW_PASSWORD: mock-only-password  # mock instance only
      CONNECTOR_ALLOWED_HOSTS: mock-servicenow
      CONNECTOR_ALLOW_INSECURE_HTTP: "1"  # the mock speaks plain HTTP; never for a real instance
      RULEBOOK_URL: http://rulebook:8000
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mock-servicenow:
        condition: service_healthy
      rulebook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  review-desk:
    build:
      context: .
      dockerfile: services/review-desk/Dockerfile
    command: ["review-desk", "serve", "--migrate", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REVIEW_DESK_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/review_desk
      CONNECTOR_HUB_URL: http://connector-hub:8000
      # Decision-log checkpoints on their own volume, not the database's.
      REVIEW_DESK_CHECKPOINT_FILE: /checkpoints/decision-log.jsonl
      REVIEW_DESK_CHECKPOINT_EVERY: "1"
    volumes:
      - checkpoints:/checkpoints
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      connector-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Assessment engine (Milestone 5). Internal only: localhost. Evidence on its own volume;
  # encrypt that volume at rest on the platform. The dev key below is for the fictional
  # demo data only (like the database password): never reuse it.
  assessment-engine:
    build:
      context: .
      dockerfile: services/assessment-engine/Dockerfile
    command: ["assessment-engine", "serve", "--migrate", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ASSESSMENT_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/assessment_engine
      ASSESSMENT_EVIDENCE_DIR: /evidence
      ASSESSMENT_EVIDENCE_KEY: ZGV2LW9ubHktZmljdGlvbmFsLWRlbW8tZGF0YS1rZXk=  # dev only
      RULEBOOK_URL: http://rulebook:8000
      REVIEW_DESK_URL: http://review-desk:8000
      # The model server is internal to the deployment. By default Compose uses the
      # SCRIPTED FAKE model below (no real model). To use llama.cpp or vLLM, set these
      # three variables (docs/model-setup.md).
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://fake-model:8000}
      MODEL_GATEWAY_MODEL: ${MODEL_GATEWAY_MODEL:-scripted-fake-v1}
      MODEL_GATEWAY_ALLOWED_HOSTS: ${MODEL_GATEWAY_ALLOWED_HOSTS:-fake-model}
    volumes:
      - evidence:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a model server on the host (docs/model-setup.md)
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      review-desk:
        condition: service_healthy
      fake-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # SCRIPTED FAKE model (demo and CI only, never a real model): answers the requests it
  # has recorded replies for (data/accuracy/synthetic-demo/recordings). Not published.
  fake-model:
    build:
      context: .
      dockerfile: services/assessment-engine/Dockerfile
    command: ["assessment-engine", "fake-model", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FAKE_MODEL_RECORDINGS: /app/data/accuracy/synthetic-demo/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Web UI for the demo. Demo only: no authentication, so localhost only (like review-desk).
  control-centre:
    build:
      context: .
      dockerfile: services/control-centre/Dockerfile
    command: ["control-centre", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RULEBOOK_URL: http://rulebook:8000
      REVIEW_DESK_URL: http://review-desk:8000
      CONNECTOR_HUB_URL: http://connector-hub:8000
      ASSESSMENT_ENGINE_URL: http://assessment-engine:8000
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      review-desk:
        condition: service_healthy
      assessment-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  checkpoints:
  rulebook-checkpoints:
  evidence:
