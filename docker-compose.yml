# Local development only. Production runs the same images on Kubernetes/OpenShift.
#
# Ports: the rulebook API is published on localhost:8000. connector-hub, review-desk and
# the mock ServiceNow and control-centre are published on 127.0.0.1 ONLY: review-desk and
# the demo UI trust placeholder identity until sign-in exists; never reachable from outside.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: govhub
      POSTGRES_PASSWORD: govhub  # local dev only
      POSTGRES_DB: rulebook
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govhub -d rulebook"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  rulebook:
    build:
      context: .
      dockerfile: services/rulebook/Dockerfile
    environment:
      # Internal tokens: everyone's public keys, and this service's own signing key.
      GOVHUB_TRUST_FILE: /keys/trust.json
      GOVHUB_SIGNING_KEY_FILE: /keys/rulebook.pem
      GOVHUB_SIGNING_KID_FILE: /keys/rulebook.kid
      RULEBOOK_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/rulebook
      # Approval-log checkpoints on their own volume, not the database's.
      RULEBOOK_APPROVAL_CHECKPOINT_FILE: /checkpoints/approval-log.jsonl
    volumes:
      - keys:/keys:ro
      - rulebook-checkpoints:/checkpoints
    ports:
      - "8000:8000"
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mock ServiceNow (Table API subset) seeded with the fictional demo records. CI and the
  # demo use this; a real instance is configured with SERVICENOW_* variables instead.
  mock-servicenow:
    build:
      context: .
      dockerfile: services/connector-hub/Dockerfile
    command: ["connector-hub", "mock-servicenow", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/__mock/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  connector-hub:
    build:
      context: .
      dockerfile: services/connector-hub/Dockerfile
    environment:
      # Internal tokens: everyone's public keys, and this service's own signing key.
      GOVHUB_TRUST_FILE: /keys/trust.json
      GOVHUB_SIGNING_KEY_FILE: /keys/connector-hub.pem
      GOVHUB_SIGNING_KID_FILE: /keys/connector-hub.kid
      SERVICENOW_INSTANCE_URL: http://mock-servicenow:8000
      SERVICENOW_USERNAME: govhub.integration
      SERVICENOW_PASSWORD: mock-only-password  # mock instance only
      CONNECTOR_ALLOWED_HOSTS: mock-servicenow
      CONNECTOR_ALLOW_INSECURE_HTTP: "1"  # the mock speaks plain HTTP; never for a real instance
      RULEBOOK_URL: http://rulebook:8000
    volumes:
      - keys:/keys:ro
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      keys:
        condition: service_completed_successfully
      mock-servicenow:
        condition: service_healthy
      rulebook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  review-desk:
    build:
      context: .
      dockerfile: services/review-desk/Dockerfile
    command: ["review-desk", "serve", "--migrate", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Evidence and facts provenance for the conflict-of-interest check.
      ASSESSMENT_ENGINE_URL: http://assessment-engine:8000
      # Internal tokens: everyone's public keys, and this service's own signing key.
      GOVHUB_TRUST_FILE: /keys/trust.json
      GOVHUB_SIGNING_KEY_FILE: /keys/review-desk.pem
      GOVHUB_SIGNING_KID_FILE: /keys/review-desk.kid
      REVIEW_DESK_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/review_desk
      CONNECTOR_HUB_URL: http://connector-hub:8000
      # Decision-log checkpoints on their own volume, not the database's.
      REVIEW_DESK_CHECKPOINT_FILE: /checkpoints/decision-log.jsonl
      REVIEW_DESK_CHECKPOINT_EVERY: "1"
    volumes:
      - keys:/keys:ro
      - checkpoints:/checkpoints
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      connector-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Assessment engine (Milestone 5). Internal only: localhost. Evidence on its own volume;
  # encrypt that volume at rest on the platform. The dev key below is for the fictional
  # demo data only (like the database password): never reuse it.
  assessment-engine:
    build:
      context: .
      dockerfile: services/assessment-engine/Dockerfile
    command: ["assessment-engine", "serve", "--migrate", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Internal tokens: everyone's public keys, and this service's own signing key.
      GOVHUB_TRUST_FILE: /keys/trust.json
      GOVHUB_SIGNING_KEY_FILE: /keys/assessment-engine.pem
      GOVHUB_SIGNING_KID_FILE: /keys/assessment-engine.kid
      ASSESSMENT_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/assessment_engine
      ASSESSMENT_EVIDENCE_DIR: /evidence
      ASSESSMENT_EVIDENCE_KEY: ZGV2LW9ubHktZmljdGlvbmFsLWRlbW8tZGF0YS1rZXk=  # dev only
      RULEBOOK_URL: http://rulebook:8000
      REVIEW_DESK_URL: http://review-desk:8000
      # The model server is internal to the deployment. By default Compose uses the
      # SCRIPTED FAKE model below (no real model). To use llama.cpp or vLLM, set these
      # three variables (docs/model-setup.md).
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://fake-model:8000}
      MODEL_GATEWAY_MODEL: ${MODEL_GATEWAY_MODEL:-scripted-fake-v1}
      MODEL_GATEWAY_ALLOWED_HOSTS: ${MODEL_GATEWAY_ALLOWED_HOSTS:-fake-model}
    volumes:
      - keys:/keys:ro
      - evidence:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a model server on the host (docs/model-setup.md)
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      review-desk:
        condition: service_healthy
      fake-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # SCRIPTED FAKE model (demo and CI only, never a real model): answers the requests it
  # has recorded replies for (data/accuracy/synthetic-demo/recordings). Not published.
  fake-model:
    build:
      context: .
      dockerfile: services/assessment-engine/Dockerfile
    command: ["assessment-engine", "fake-model", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FAKE_MODEL_RECORDINGS: /app/data/accuracy/synthetic-demo/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: development signing keys and the trust file, in their own volume, made as
  # the same non-root user the services run as. Never used outside local dev and CI.
  keys:
    build:
      context: .
      dockerfile: services/control-centre/Dockerfile
    command: ["python", "-m", "govhub_shared.auth.devkeys", "/keys", "--if-missing"]
    volumes:
      - keys:/keys

  # Sign-in provider for local and CI (profile "oidc"): fictional realm and users.
  #   docker compose --profile oidc up -d keycloak   then   AUTH_MODE=oidc make up
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin  # local dev only
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Web UI. Signs users in (OIDC) or runs the labelled demo mode; localhost only here.
  control-centre:
    build:
      context: .
      dockerfile: services/control-centre/Dockerfile
    command: ["control-centre", "serve", "--migrate", "--seed-tenants", "data/demo/tenants.toml",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Its own database: tenants, sessions, and later their data settings and grants.
      CONTROL_CENTRE_DATABASE_URL: postgresql+psycopg://govhub:govhub@postgres:5432/control_centre
      # Labelled demo mode (fictional users). It refuses to start unless every tenant is
      # synthetic and the deployment is internal-only (ports published on 127.0.0.1).
      # Sign-in with Keycloak instead: docs/identity.md (profile "oidc").
      AUTH_MODE: ${AUTH_MODE:-demo}
      GOVHUB_INTERNAL_ONLY: "1"
      GOVHUB_SECURE_COOKIES: "0"  # plain HTTP on localhost only
      GOVHUB_SIGNING_KEY_FILE: /keys/control-centre.pem
      GOVHUB_SIGNING_KID_FILE: /keys/control-centre.kid
      GOVHUB_TRUST_FILE: /keys/trust.json
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:8080/realms/govhub}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/govhub}
      OIDC_CLIENT_ID: control-centre
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-fictional-client-secret}
      OIDC_REDIRECT_URL: http://127.0.0.1:8004/auth/callback
      OIDC_ALLOWED_HOSTS: keycloak,127.0.0.1
      OIDC_ALLOW_INSECURE_HTTP: "1"  # local Keycloak only
      RULEBOOK_URL: http://rulebook:8000
      REVIEW_DESK_URL: http://review-desk:8000
      CONNECTOR_HUB_URL: http://connector-hub:8000
      ASSESSMENT_ENGINE_URL: http://assessment-engine:8000
    volumes:
      - keys:/keys:ro
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      review-desk:
        condition: service_healthy
      assessment-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  checkpoints:
  rulebook-checkpoints:
  evidence:
  keys:
