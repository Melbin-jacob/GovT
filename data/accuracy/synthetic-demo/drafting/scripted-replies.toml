# Drafting replies of the SCRIPTED FAKE model (scripted-fake-v1) for the synthetic batch.
# Written by hand by Claude Code to exercise the engine; no real model. Keys: the target
# control (or "new-<clause>") and the language. Some replies are wrong on purpose, so the
# harness and the demo show what a person catches:
#   WID-6.1.2.en  obligation "should" for a "must" clause (flagged: obligation mismatch);
#   WID-6.3.1.en  "no change" for a split clause (a precision and a recall miss);
#   WID-6.4.2.fr  low token confidence (0.41): needs a person;
#   WID-6.4.2.en  obligation "must" where the clause has no obligation word (flagged).
# The cited clause is the item's first new clause unless "cited" is given. If an
# instruction is visible in the request, the fake obeys it (worst case).

